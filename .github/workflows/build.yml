name: Build Fluxio APK

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código (con submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar cmake y ninja-build
        run: sudo apt-get install -y cmake ninja-build

      - name: Configurar Android NDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK versión requerida
        run: echo "y" | sdkmanager "ndk;28.2.13676358"

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Compilar APK debug
        run: ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: fluxio-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7