name: Android Lint
on:
  push:
    branches: []
  pull_request:
    branches: []
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Clone submodules
      run: git submodule update --init --recursive --remote
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Apply spotless formatting automatically
      run: ./gradlew spotlessApply
    - name: Commit formatting fixes if any
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git diff --quiet || (git add . && git commit -m "Auto: aplicar formato Spotless")
    - name: Push formatting fixes if any
      run: git push
    - name: Check formatting with spotless
      run: ./gradlew spotlessCheck
    - name: Test musikr with Gradle
      run: ./gradlew musikr:testDebug